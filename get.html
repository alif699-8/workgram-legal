<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Workgram</title>
<style>
  :root {
    --bg: #080810;
    --card: #141420;
    --border: #242436;
    --orange: #ff5c1a;
    --white: #eeeef5;
    --grey: #9090a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  .logo {
    font-size: 32px;
    font-weight: 900;
    margin-bottom: 8px;
  }
  .logo .orange { color: var(--orange); }
  .sub {
    color: var(--grey);
    font-size: 14px;
    margin-bottom: 32px;
  }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { color: var(--grey); font-size: 14px; margin-bottom: 28px; }
  .btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--white);
  }
  .btn svg { flex-shrink: 0; }
  .btn.primary {
    background: var(--orange);
    color: #fff;
    border: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo"><span>Work</span><span class="orange">Gram</span></div>
    <div class="sub">Kerry's local trades marketplace</div>
    <div class="spinner" id="spinner"></div>
    <div class="status" id="status">Redirecting you to the right store…</div>

    <!-- Manual fallback links (also shown if auto-redirect fails or JS is off) -->
    <a class="btn primary" id="ios-link" href="https://apps.apple.com/us/app/workgram/id6782429046">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M16.365 1.43c0 1.14-.463 2.032-1.222 2.71-.673.6-1.6 1.05-2.6.977-.12-1.09.44-2.19 1.15-2.87.71-.7 1.86-1.24 2.66-1.24.01.14.01.28.01.42zM20.5 17.34c-.5 1.15-.74 1.65-1.38 2.66-.9 1.4-2.17 3.14-3.75 3.16-1.4.02-1.76-.9-3.66-.9-1.9 0-2.3.88-3.7.92-1.58.05-2.78-1.5-3.68-2.9C1.86 17.5.7 13.55 2.3 10.9c.8-1.3 2.23-2.13 3.78-2.15 1.44-.02 2.8.97 3.68.97.87 0 2.53-1.2 4.27-1.02.73.03 2.77.29 4.08 2.2-.1.07-2.44 1.42-2.41 4.24.02 3.37 2.96 4.5 2.98 4.51-.02.07-.44 1.53-1.13 3.19z"/></svg>
      Download on the App Store
    </a>
    <a class="btn" id="android-link" href="https://play.google.com/store/apps/details?id=com.workgram.app">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M6 3l14 9-14 9V3z" fill="#3ddc84"/></svg>
      Get it on Google Play
    </a>
  </div>

  <script>
    // ---- Live store links ----
    var IOS_URL = "https://apps.apple.com/us/app/workgram/id6782429046";
    var ANDROID_URL = "https://play.google.com/store/apps/details?id=com.workgram.app";
    // ---------------------------

    var ua = navigator.userAgent || navigator.vendor || window.opera;
    var isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
    var isAndroid = /android/i.test(ua);

    document.getElementById('ios-link').href = IOS_URL;
    document.getElementById('android-link').href = ANDROID_URL;

    if (isIOS) {
      document.getElementById('status').textContent = "Taking you to the App Store…";
      window.location.href = IOS_URL;
    } else if (isAndroid) {
      document.getElementById('status').textContent = "Taking you to Google Play…";
      window.location.href = ANDROID_URL;
    } else {
      // Desktop or unknown device — just show both buttons, no redirect
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status').textContent = "Choose your platform below:";
    }
  </script>
</body>
</html>
